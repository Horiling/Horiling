<svg width="1280" height="320" viewBox="0 0 1280 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.52" stop-color="#071A22"/>
      <stop offset="1" stop-color="#0A0F1F"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(290 150) rotate(26) scale(360 180)">
      <stop stop-color="#0EA5A4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0EA5A4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1050 78) rotate(180) scale(240 120)">
      <stop stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="120" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5A4" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#0EA5A4" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#22C55E" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 64px;
        font-weight: 800;
        letter-spacing: 0.28em;
        fill: #F8FAFC;
      }
      .subtitle {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.12em;
        fill: #C7D2FE;
      }
      .meta {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 15px;
        font-weight: 500;
        fill: #94A3B8;
      }
      .chipText {
        font-family: Inter, Segoe UI, Arial, sans-serif;
        font-size: 14px;
        font-weight: 700;
        fill: #E2E8F0;
        letter-spacing: 0.08em;
      }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="320" rx="28" fill="url(#bg)"/>

  <rect x="24" y="24" width="1232" height="272" rx="22" fill="none" stroke="rgba(148,163,184,0.16)"/>
  <rect x="44" y="44" width="1192" height="232" rx="18" fill="none" stroke="rgba(148,163,184,0.08)"/>

  <path d="M0 72H1280" stroke="rgba(148,163,184,0.06)"/>
  <path d="M0 132H1280" stroke="rgba(148,163,184,0.05)"/>
  <path d="M0 192H1280" stroke="rgba(148,163,184,0.05)"/>
  <path d="M0 252H1280" stroke="rgba(148,163,184,0.06)"/>

  <path d="M120 0V320" stroke="rgba(148,163,184,0.05)"/>
  <path d="M320 0V320" stroke="rgba(148,163,184,0.04)"/>
  <path d="M520 0V320" stroke="rgba(148,163,184,0.04)"/>
  <path d="M720 0V320" stroke="rgba(148,163,184,0.04)"/>
  <path d="M920 0V320" stroke="rgba(148,163,184,0.04)"/>
  <path d="M1120 0V320" stroke="rgba(148,163,184,0.05)"/>

  <ellipse cx="290" cy="150" rx="360" ry="180" fill="url(#glowLeft)"/>
  <ellipse cx="1050" cy="78" rx="240" ry="120" fill="url(#glowRight)"/>

  <rect x="112" y="202" width="1056" height="2" rx="1" fill="url(#line)" filter="url(#softGlow)"/>

  <text x="110" y="132" class="title">HORILING</text>
  <text x="114" y="170" class="subtitle">GAME DEVELOPER / GAMEPLAY PROGRAMMER</text>
  <text x="1110" y="60" text-anchor="end" class="meta">@horiling0192</text>
  <text x="114" y="236" class="meta">dark worlds · gameplay systems · game UI · narrative-driven games</text>

  <g transform="translate(112 258)">
    <rect x="0" y="0" width="92" height="30" rx="10" fill="rgba(15,23,42,0.88)" stroke="rgba(34,197,94,0.18)"/>
