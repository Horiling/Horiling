    <rect x="220" y="0" width="112" height="30" rx="10" fill="rgba(15,23,42,0.88)" stroke="rgba(34,197,94,0.18)"/>
    <text x="276" y="20" text-anchor="middle" class="chipText">LIBGDX</text>

    <rect x="344" y="0" width="92" height="30" rx="10" fill="rgba(15,23,42,0.88)" stroke="rgba(14,165,164,0.18)"/>
    <text x="390" y="20" text-anchor="middle" class="chipText">C++</text>

    <rect x="448" y="0" width="92" height="30" rx="10" fill="rgba(15,23,42,0.88)" stroke="rgba(34,197,94,0.18)"/>
    <text x="494" y="20" text-anchor="middle" class="chipText">C#</text>

    <rect x="552" y="0" width="118" height="30" rx="10" fill="rgba(15,23,42,0.88)" stroke="rgba(14,165,164,0.18)"/>
